services:
  api:
    build:
      context: ./backend
    container_name: hrms-api
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: sqlite+aiosqlite:///./storage/hrms.db
      POLICY_RAG_SOURCE_DIR: /app/storage/hr-policies
      POLICY_RAG_INDEX_PATH: /app/storage/policy-rag-index.json
    volumes:
      - ./backend:/app
      - ./leave_policy_sample.pdf:/app/storage/hr-policies/leave_policy_sample.pdf:ro
      - ./policy_sample.pdf:/app/storage/hr-policies/policy_sample.pdf:ro
      - ./privacy_policy_sample.txt:/app/storage/hr-policies/privacy_policy_sample.txt:ro
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    container_name: hrms-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_DISABLE_DEVTOOLS: "1"
    command: sh -c "rm -rf .next && npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
